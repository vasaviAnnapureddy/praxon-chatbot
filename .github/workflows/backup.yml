# =============================================================================
# Nightly encrypted backup of the Neon database.
#
# WHY THIS EXISTS
# Neon's Free plan keeps only a 6-hour history window and has no scheduled
# backups (neon.com/docs/introduction/plans, checked 23 Nov 2026). So without
# this job, anything older than 6 hours is gone for good.
#
# WHERE THE BACKUP GOES
# Into a SEPARATE PRIVATE repository, praxon-backups.
#
#   Q: Why not keep it in this repository, as a workflow artifact? Simpler.
#   A: Artifacts follow the repository's read access, and THIS repository is
#      public on purpose, so the code can be shown to people. A public artifact
#      would mean visitors' names, emails and phone numbers sitting in public,
#      protected only by the passphrase. Encryption is the second lock, never
#      the first one. So the data goes somewhere private and the code stays open.
#
#   Q: Won't a nightly commit redeploy the live site?
#   A: No. The commit lands in praxon-backups, which Render does not watch.
#
# NOTE ON GROWTH: old files are deleted after KEEP_DAYS, but Git keeps every
# version forever, so the backups repository grows by roughly one encrypted
# dump per night and never shrinks. At this database's size that is fine for
# years. If it ever gets large, delete the repository and start a fresh one.
#
# WHAT MAKES THIS MORE THAN "A FILE WAS CREATED"
# The job checks its own work before it calls itself successful:
#   1. the dump really contains the expected tables, with rows in them
#   2. the encrypted file can be decrypted again with the passphrase
#   3. the decrypted copy is byte-for-byte identical to the original
# A backup nobody has opened is a guess. These three checks are the proof.
#
# SECRETS NEEDED (Settings > Secrets and variables > Actions)
#   NEON_DATABASE_URL   the database to back up
#   BACKUP_PASSPHRASE   locks the file. If this is lost, the backups are
#                       unreadable by anyone, forever. Password manager.
#   BACKUP_REPO         e.g. vasaviAnnapureddy/praxon-backups  (must be PRIVATE)
#   BACKUP_REPO_TOKEN   a fine-grained token that can write to that one
#                       repository and nothing else
# =============================================================================

name: Nightly database backup

on:
  schedule:
    # 19:30 UTC = 01:00 IST. Quiet hours in India, so the dump never competes
    # with a real visitor for Neon's free compute.
    - cron: "30 19 * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: read

env:
  PG_VERSION: "18"        # must match your Neon project's Postgres version (checked: 18.6)
  KEEP_DAYS: 30           # nights kept in the backups repository
  # Tables that must appear in every dump. If one is missing, the dump is
  # pointing at the wrong database or something was deleted — fail loudly.
  REQUIRED_TABLES: "users documents conversations messages leads projects"

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # The checking scripts live in the repo, so they can be read and tested
      # like any other code instead of being buried inside this file.
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------- 0
      - name: Check the required secrets exist
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          missing=0
          for name in NEON_DATABASE_URL BACKUP_PASSPHRASE BACKUP_REPO BACKUP_REPO_TOKEN; do
            if [ -z "${!name}" ]; then echo "MISSING SECRET: $name"; missing=1; fi
          done
          [ "$missing" = "0" ] || {
            echo "Add them in Settings > Secrets and variables > Actions"; exit 1; }

      # ---------------------------------------------------------------- 1
      - name: Dump the database
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

          # pg_dump refuses to dump a server newer than itself, and GitHub's
          # runners ship an older client than Neon's server. So pg_dump runs
          # inside a container pinned to Neon's own major version.
          #
          # --no-owner / --no-privileges: the dump restores into a fresh branch
          # whose role names differ. Without these, restore fails on every object.
          docker run --rm -e PGCONNECT_TIMEOUT=20 \
            postgres:${PG_VERSION}-alpine \
            pg_dump "$DATABASE_URL" \
              --no-owner --no-privileges --format=plain \
            > "praxon-$STAMP.sql"

          ls -l "praxon-$STAMP.sql"

      # ---------------------------------------------------------------- 2
      - name: Prove the dump has real content
        run: |
          set -euo pipefail
          SQL="praxon-$STAMP.sql"

          SIZE=$(wc -c < "$SQL")
          # Under 1 KB means the connection worked but the database was empty
          # or wrong. Better to fail than to keep 90 days of empty files.
          [ "$SIZE" -gt 1024 ] || { echo "Dump is only $SIZE bytes — failing."; exit 1; }

          # Every table the dump actually contains.
          # sed, not `grep -oP`: -P depends on the runner's locale and fails on
          # some systems, which would break the backup for an unrelated reason.
          sed -n 's/^CREATE TABLE public\.\([A-Za-z0-9_]*\).*/\1/p' "$SQL" | sort -u > tables.txt
          echo "Tables in the dump:"; sed 's/^/  /' tables.txt

          missing=0
          for t in $REQUIRED_TABLES; do
            grep -qx "$t" tables.txt || { echo "MISSING TABLE: $t"; missing=1; }
          done
          [ "$missing" = "0" ] || { echo "The dump is missing expected tables."; exit 1; }

          # Count the rows the dump will actually restore, per table. A dump
          # with every table present but zero rows anywhere is still a bad backup.
          python3 .github/scripts/count_rows.py "$SQL" > rows.txt
          echo "Rows per table:"; sed 's/^/  /' rows.txt

          TOTAL=$(awk -F'\t' '$1=="TOTAL"{print $2}' rows.txt)
          [ "${TOTAL:-0}" -gt 0 ] || { echo "Every table is empty — failing."; exit 1; }

          {
            echo "DUMP_SIZE=$SIZE"
            echo "DUMP_SHA=$(sha256sum "$SQL" | cut -d' ' -f1)"
            echo "TABLE_COUNT=$(wc -l < tables.txt)"
            echo "ROW_TOTAL=$TOTAL"
          } >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- 3
      - name: Compress and encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gzip -9 "praxon-$STAMP.sql"
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" \
              --output "praxon-$STAMP.sql.gz.gpg" \
              "praxon-$STAMP.sql.gz"
          rm -f "praxon-$STAMP.sql.gz"          # the unlocked copy never survives
          ls -lh "praxon-$STAMP.sql.gz.gpg"
          echo "ENC_SIZE=$(wc -c < "praxon-$STAMP.sql.gz.gpg")" >> "$GITHUB_ENV"

      # ---------------------------------------------------------------- 4
      - name: Prove the encrypted file can be opened again
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          # This is the step that turns "a file exists" into "a backup exists".
          # It unlocks the file with the same passphrase a human would use, and
          # checks the result is byte-for-byte what went in. A wrong passphrase,
          # a truncated write or a broken gzip all fail right here, tonight,
          # instead of on the day the data is actually needed.
          gpg --batch --yes --decrypt \
              --passphrase "$PASSPHRASE" \
              --output check.sql.gz \
              "praxon-$STAMP.sql.gz.gpg"
          gunzip -c check.sql.gz > check.sql

          BACK_SHA=$(sha256sum check.sql | cut -d' ' -f1)
          echo "original : $DUMP_SHA"
          echo "recovered: $BACK_SHA"
          [ "$BACK_SHA" = "$DUMP_SHA" ] || { echo "Recovered file does NOT match."; exit 1; }

          rm -f check.sql check.sql.gz
          echo "Verified: the backup decrypts and matches the original exactly."

      # ---------------------------------------------------------------- 5
      - name: Store it in the private backups repository
        env:
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          # --depth 1: only the latest commit is needed. Cloning years of
          # encrypted dumps every night would be slow for no reason.
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${BACKUP_REPO}.git" backups
          cd backups

          # A public repository here would defeat the whole point, so refuse.
          # (The dump is encrypted, but encryption is the second lock.)
          #
          # The curl is deliberately NOT inside the assignment: with `set -e`,
          # a failed curl there would abort the step and look exactly like
          # "the repository is public", which is a different problem entirely.
          if ! curl -fsS -H "Authorization: Bearer ${TOKEN}" \
                 -H "Accept: application/vnd.github+json" \
                 "https://api.github.com/repos/${BACKUP_REPO}" > repo.json; then
            echo "REFUSING: could not ask GitHub whether ${BACKUP_REPO} is private."
            echo "Check BACKUP_REPO_TOKEN is valid and still covers that repository."
            exit 1
          fi
          VISIBILITY=$(sed -n 's/.*"private": *\(true\|false\).*/\1/p' repo.json | head -1)
          rm -f repo.json
          echo "backups repository private: ${VISIBILITY:-could not tell}"
          if [ "$VISIBILITY" != "true" ]; then
            echo "REFUSING to write the backup."
            echo "${BACKUP_REPO} must be PRIVATE: these dumps hold visitors'"
            echo "names, emails and phone numbers."
            exit 1
          fi

          mkdir -p daily
          mv "../praxon-$STAMP.sql.gz.gpg" daily/

          # Keep the last KEEP_DAYS nights. Older files go here, not by hand.
          ls -1t daily/*.gpg | tail -n +$((KEEP_DAYS + 1)) | xargs -r rm -f
          KEPT=$(ls -1 daily/*.gpg | wc -l)
          echo "KEPT_FILES=$KEPT" >> "$GITHUB_ENV"

          {
            echo "# Database backups"
            echo
            echo "Encrypted nightly dumps from the praxon-chatbot repository."
            echo "AES-256. The passphrase is the BACKUP_PASSPHRASE secret there,"
            echo "and in the password manager. Lose it and these files are"
            echo "unreadable by anyone, forever."
            echo
            echo "Every file here was decrypted and checked byte-for-byte against"
            echo "the original on the night it was made."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Last backup | $STAMP |"
            echo "| Files kept | $KEPT |"
            echo "| Tables | $TABLE_COUNT |"
            echo "| Rows | $ROW_TOTAL |"
            echo
            echo "Restore steps: \`docs/RESTORE.md\` in the praxon-chatbot repository."
          } > README.md

          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add -A
          git commit -m "Backup $STAMP ($ROW_TOTAL rows, $TABLE_COUNT tables)" \
            || { echo "nothing changed"; exit 0; }
          git push

      # ---------------------------------------------------------------- 6
      - name: Write the evidence
        if: always()
        run: |
          {
            echo "## Backup ${{ job.status }} — ${STAMP:-unknown date}"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Tables in the dump | ${TABLE_COUNT:-not reached} |"
            echo "| Rows in the dump | ${ROW_TOTAL:-not reached} |"
            echo "| Plain dump size | ${DUMP_SIZE:-not reached} bytes |"
            echo "| Encrypted size | ${ENC_SIZE:-not reached} bytes |"
            echo "| Decrypted copy matches the original | ${DUMP_SHA:+verified}${DUMP_SHA:-not reached} |"
            echo "| Nights now stored | ${KEPT_FILES:-not reached} of ${KEEP_DAYS} |"
            echo ""
            if [ -f rows.txt ]; then
              echo "<details><summary>Rows per table</summary>"
              echo ""
              echo '```'
              cat rows.txt
              echo '```'
              echo ""
              echo "</details>"
            fi
            echo ""
            echo "SHA-256 of the plain dump: \`${DUMP_SHA:-not reached}\`"
            echo ""
            echo "Restore steps: \`docs/RESTORE.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
